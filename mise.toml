# Toolchain pins for nian-pass (managed by mise).
# Overrides the global ~/.config/mise/config.toml for this repository only.
# rust-toolchain.toml additionally pins the Rust channel for direct cargo
# invocations that bypass mise (editors, CI containers).

[settings]
lockfile = true

[tool_alias]
# Use pnpm's official GitHub releases across platforms, including macOS x64.
pnpm = "github:pnpm/pnpm"

[tools]
node = "26.9.0"
pnpm = "12.7.0"
rust = "1.98.1"
