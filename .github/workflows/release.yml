name: Production release

# Audited action pins: checkout v4.2.2, setup-node v4.4.0,
# setup-java v4.7.1, upload-artifact v4.6.2, download-artifact v4.3.0.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing vX.Y.Z or vX.Y.Z-prerelease tag to build"
        required: true
        type: string
      forgejo_ci_status:
        description: "Observed canonical Forgejo CI status for this tag"
        required: true
        default: "NOT RUN"
        type: choice
        options:
          - "NOT RUN"
          - "PASS"
      publish:
        description: "Publish the source-classified release instead of retaining a draft"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  NODE_VERSION: "26.7.0"
  PNPM_VERSION: "11.22.0"
  COREPACK_VERSION: "0.35.0"
  RUST_VERSION: "1.98.0"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      release_kind: ${{ steps.source.outputs.release_kind }}
      is_prerelease: ${{ steps.source.outputs.is_prerelease }}
      build_mode: ${{ steps.source.outputs.build_mode }}
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned release tools
        run: |
          set -Eeuo pipefail
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          corepack install --global "pnpm@${PNPM_VERSION}"
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
          pnpm install --frozen-lockfile
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
          test "$(rustc --version | awk '{print $2}')" = "${RUST_VERSION}"
      - name: Verify immutable source identity
        id: source
        env:
          PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}
        run: |
          set -Eeuo pipefail
          make release-source-check
          make release-policy-check
          make security-hardening-check
          release_kind="$(node scripts/release_version.mjs "$(cat VERSION)")"
          case "${release_kind}" in
            prerelease) is_prerelease=true ;;
            final) is_prerelease=false ;;
            *) echo "Unknown release kind: ${release_kind}" >&2; exit 1 ;;
          esac
          build_mode="$(RELEASE_EVENT_NAME="${GITHUB_EVENT_NAME}" PUBLISH_RELEASE="${PUBLISH_RELEASE}" node scripts/release_execution_mode.mjs)"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "$(cat VERSION)" >> "${GITHUB_OUTPUT}"
          printf 'release_kind=%s\n' "${release_kind}" >> "${GITHUB_OUTPUT}"
          printf 'is_prerelease=%s\n' "${is_prerelease}" >> "${GITHUB_OUTPUT}"
          printf 'build_mode=%s\n' "${build_mode}" >> "${GITHUB_OUTPUT}"

  linux:
    needs: preflight
    if: ${{ needs.preflight.outputs.build_mode == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    outputs:
      process_smoke: ${{ steps.report.outputs.process_smoke }}
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Linux release prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential dbus-x11 file libayatana-appindicator3-dev libfuse2 librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf unzip xvfb
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          corepack install --global "pnpm@${PNPM_VERSION}"
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
          pnpm install --frozen-lockfile
      - name: Build Linux release payload
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.commit }}"
          make release-linux-build
      - name: Validate Linux process and archive permissions
        id: report
        run: |
          set -Eeuo pipefail
          target/release/nian-pass-browser-host --version
          cargo test --locked --release -p nian-pass-browser-host --test process actual_host_process_proxies_approval_candidates_and_one_credential
          test -x target/release/nian-pass-desktop
          set +e
          timeout --signal=TERM 10s dbus-run-session -- xvfb-run -a target/release/nian-pass-desktop >/tmp/nian-pass-process-smoke.log 2>&1
          desktop_status=$?
          set -e
          test "$desktop_status" -eq 0 -o "$desktop_status" -eq 124
          extraction="$(mktemp -d)"
          trap 'rm -rf -- "$extraction"' EXIT
          unzip -q "artifacts/release/nian-pass-native-host-linux-x86_64-${{ needs.preflight.outputs.version }}.zip" -d "$extraction"
          test -x "$extraction/nian-pass-browser-host"
          test ! -x "$extraction/INSTALL.txt"
          test -s "$(find artifacts/release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -s "$(find artifacts/release -maxdepth 1 -type f -name '*.deb' -print -quit)"
          printf 'process_smoke=PASS\n' >> "${GITHUB_OUTPUT}"
      - name: Upload Linux payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-artifacts
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: preflight
    if: ${{ needs.preflight.outputs.build_mode == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 75
    outputs:
      build: ${{ steps.build.outputs.build }}
      process_smoke: ${{ steps.build.outputs.process_smoke }}
      signing: ${{ steps.build.outputs.signing }}
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned Windows release tools
        shell: pwsh
        run: |
          npm install --global "corepack@$env:COREPACK_VERSION"
          corepack enable
          corepack install --global "pnpm@$env:PNPM_VERSION"
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
          rustup target add x86_64-pc-windows-msvc --toolchain $env:RUST_VERSION
      - name: Build and validate native Windows payload
        id: build
        shell: pwsh
        env:
          NIAN_PASS_WINDOWS_PFX_BASE64: ${{ secrets.NIAN_PASS_WINDOWS_PFX_BASE64 }}
          NIAN_PASS_WINDOWS_PFX_PASSWORD: ${{ secrets.NIAN_PASS_WINDOWS_PFX_PASSWORD }}
        run: |
          if ((git rev-parse HEAD).Trim() -ne "${{ needs.preflight.outputs.commit }}") { throw "release commit mismatch" }
          ./scripts/release_windows.ps1
          $installer = Get-ChildItem artifacts/release -File -Filter *.exe | Select-Object -First 1
          if (-not $installer -or $installer.Length -eq 0) { throw "non-empty NSIS installer is required" }
      - name: Upload Windows payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-artifacts
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  browser:
    needs: preflight
    if: ${{ needs.preflight.outputs.build_mode == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build deterministic browser payload
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.commit }}"
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          corepack install --global "pnpm@${PNPM_VERSION}"
          pnpm install --frozen-lockfile
          make release-browser-package
      - name: Upload browser payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-artifacts
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  android:
    needs: preflight
    if: ${{ needs.preflight.outputs.build_mode == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      signing: ${{ steps.build.outputs.signing }}
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned Android release tools
        run: |
          set -Eeuo pipefail
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          corepack install --global "pnpm@${PNPM_VERSION}"
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
          rustup target add aarch64-linux-android x86_64-linux-android --toolchain "${RUST_VERSION}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "platform-tools"
          pnpm install --frozen-lockfile
      - name: Build and statically verify Android payload
        id: build
        env:
          NIAN_PASS_ANDROID_KEYSTORE_BASE64: ${{ secrets.NIAN_PASS_ANDROID_KEYSTORE_BASE64 }}
          NIAN_PASS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NIAN_PASS_ANDROID_KEYSTORE_PASSWORD }}
          NIAN_PASS_ANDROID_KEY_ALIAS: ${{ secrets.NIAN_PASS_ANDROID_KEY_ALIAS }}
          NIAN_PASS_ANDROID_KEY_PASSWORD: ${{ secrets.NIAN_PASS_ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.commit }}"
          values=("${NIAN_PASS_ANDROID_KEYSTORE_BASE64}" "${NIAN_PASS_ANDROID_KEYSTORE_PASSWORD}" "${NIAN_PASS_ANDROID_KEY_ALIAS}" "${NIAN_PASS_ANDROID_KEY_PASSWORD}")
          configured=0
          for value in "${values[@]}"; do test -n "$value" && configured=$((configured + 1)); done
          if test "$configured" -eq 0; then
            signing="NOT CONFIGURED"
          elif test "$configured" -ne 4; then
            echo "Android signing configuration is incomplete" >&2
            exit 1
          else
            signing="PASS"
            export NIAN_PASS_ANDROID_KEYSTORE="${RUNNER_TEMP}/nian-pass-release.keystore"
            printf '%s' "${NIAN_PASS_ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${NIAN_PASS_ANDROID_KEYSTORE}"
            trap 'rm -f -- "${NIAN_PASS_ANDROID_KEYSTORE}"' EXIT
          fi
          make release-android-build
          if test "$signing" = "PASS"; then
            while IFS= read -r apk; do
              "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            done < <(find artifacts/release -maxdepth 1 -type f -name '*.apk' -print)
          fi
          printf 'signing=%s\n' "$signing" >> "${GITHUB_OUTPUT}"
      - name: Upload Android payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-artifacts
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  gateway:
    needs: preflight
    if: ${{ needs.preflight.outputs.build_mode == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build and smoke-test gateway payload
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.commit }}"
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          corepack install --global "pnpm@${PNPM_VERSION}"
          pnpm install --frozen-lockfile
          make gateway-container-check release-gateway-image
      - name: Upload gateway payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateway-artifacts
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: [preflight, linux, windows, browser, android, gateway]
    if: ${{ needs.preflight.outputs.build_mode == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned attestation tools
        run: |
          set -Eeuo pipefail
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          corepack install --global "pnpm@${PNPM_VERSION}"
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
          pnpm install --frozen-lockfile
      - name: Download Windows payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-artifacts
          path: artifacts/platforms/windows
      - name: Download Linux payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-artifacts
          path: artifacts/platforms/linux
      - name: Download browser payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: browser-artifacts
          path: artifacts/platforms/browser
      - name: Download Android payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-artifacts
          path: artifacts/platforms/android
      - name: Download gateway payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gateway-artifacts
          path: artifacts/platforms/gateway
      - name: Assemble and attest canonical release set
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
          FORGEJO_CI_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.forgejo_ci_status || 'NOT RUN' }}
          PREFLIGHT_STATUS: PASS
          WINDOWS_BUILD_STATUS: ${{ needs.windows.outputs.build }}
          WINDOWS_PROCESS_STATUS: ${{ needs.windows.outputs.process_smoke }}
          WINDOWS_GUI_STATUS: NOT RUN
          WINDOWS_SIGNING_STATUS: ${{ needs.windows.outputs.signing }}
          LINUX_APPIMAGE_STATUS: PASS
          LINUX_DEB_STATUS: PASS
          LINUX_NATIVE_PACKAGE_STATUS: PASS
          LINUX_PROCESS_STATUS: ${{ needs.linux.outputs.process_smoke }}
          LINUX_GUI_STATUS: NOT RUN
          CHROMIUM_STATUS: PASS
          FIREFOX_STATUS: PASS
          BROWSER_SIGNING_STATUS: NOT CONFIGURED
          ANDROID_APK_STATUS: PASS
          ANDROID_STATIC_STATUS: PASS
          ANDROID_RUNTIME_STATUS: NOT RUN
          ANDROID_SIGNING_STATUS: ${{ needs.android.outputs.signing }}
          GATEWAY_IMAGE_STATUS: PASS
          GATEWAY_SMOKE_STATUS: PASS
          GATEWAY_PUBLISH_STATUS: NOT CONFIGURED
          ARTIFACT_SCAN_STATUS: PASS
          DOCKER_LAYER_SCAN_STATUS: PASS
          SBOM_STATUS: PASS
          MANIFEST_STATUS: PASS
          CHECKSUM_STATUS: PASS
          GITHUB_RELEASE_STATUS: DRAFT
          RELEASE_STATUS_DATA_OUTPUT: ${{ runner.temp }}/release-status.json
          RELEASE_STATUS_DATA_FILE: ${{ runner.temp }}/release-status.json
          RELEASE_RUNNER_IMAGES: ubuntu-24.04,windows-2025
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          make release-source-check
          node scripts/assemble_release.mjs
          node scripts/release_artifacts.mjs scan
          node scripts/release_status.mjs
          node scripts/release_artifacts.mjs sbom
          node scripts/release_artifacts.mjs manifest
          node scripts/release_artifacts.mjs checksums
          (cd artifacts/release && sha256sum --check SHA256SUMS)
      - name: Upload canonical release set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nian-pass-${{ env.RELEASE_TAG }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [preflight, linux, windows, browser, android, gateway, attest]
    if: ${{ always() && needs.preflight.result == 'success' && (needs.preflight.outputs.build_mode == 'false' || needs.attest.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download current-run canonical release set for draft staging
        if: ${{ needs.preflight.outputs.build_mode == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nian-pass-${{ env.RELEASE_TAG }}
          path: release
      - name: Resolve immutable publication policy
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}
          FORGEJO_CI_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.forgejo_ci_status || 'NOT RUN' }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
          RELEASE_KIND: ${{ needs.preflight.outputs.release_kind }}
          RELEASE_IS_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          existing_metadata="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases" | node scripts/github_release_state.mjs tsv)"
          IFS=$'\t' read -r release_state existing_prerelease release_id release_target_commitish <<< "${existing_metadata}"
          publication_action="$(EXISTING_RELEASE_STATE="${release_state}" EXISTING_RELEASE_PRERELEASE="${existing_prerelease}" node scripts/release_publication.mjs)"
          printf 'action=%s\n' "${publication_action}" >> "${GITHUB_OUTPUT}"
          printf 'release_id=%s\n' "${release_id}" >> "${GITHUB_OUTPUT}"
      - name: Download existing validated GitHub draft assets for publication
        if: ${{ steps.publication.outputs.action == 'UPDATE_AND_PUBLISH' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.publication.outputs.release_id }}
        run: |
          set -Eeuo pipefail
          test -n "${RELEASE_ID}"
          mkdir -p release
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" |
            node -e '
              const pages = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
              const assets = pages.every(Array.isArray) ? pages.flat() : pages;
              if (!Array.isArray(assets)) throw new Error("release assets response is malformed");
              for (const asset of assets) {
                if (!Number.isSafeInteger(asset?.id) || asset.id <= 0 || typeof asset.name !== "string" || !asset.name || asset.name.includes("/") || asset.name === "." || asset.name === "..") throw new Error("release asset metadata is malformed");
                process.stdout.write(`${asset.id}\t${Buffer.from(asset.name).toString("base64")}\n`);
              }
            ' |
            while IFS=$'\t' read -r asset_id encoded_name; do
              asset_name="$(node -e 'process.stdout.write(Buffer.from(process.argv[1], "base64").toString("utf8"))' "${encoded_name}")"
              gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "release/${asset_name}"
            done
      - name: Verify and stage GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_ACTION: ${{ steps.publication.outputs.action }}
          FORGEJO_CI_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.forgejo_ci_status || 'NOT RUN' }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
          RELEASE_KIND: ${{ needs.preflight.outputs.release_kind }}
          RELEASE_IS_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
          RELEASE_ID: ${{ steps.publication.outputs.release_id }}
        run: |
          set -Eeuo pipefail
          (cd release && sha256sum --check SHA256SUMS)

          read_release_state() {
            local metadata draft prerelease release_id tag target_commitish
            metadata="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" | node scripts/github_release_identity.mjs tsv)"
            IFS=$'\t' read -r draft prerelease release_id tag target_commitish <<< "${metadata}"
            test "${release_id}" = "${RELEASE_ID}"
            test "${tag}" = "${RELEASE_TAG}"
            test "${target_commitish}" = "${RELEASE_COMMIT}"
            printf '%s\t%s\n' "${draft}" "${prerelease}"
          }

          release_upload() {
            local asset asset_name encoded_name existing_asset_id
            for asset in "$@"; do
              test -f "${asset}"
              asset_name="$(basename -- "${asset}")"
              existing_asset_id="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" | node -e '
                const name = process.argv[1];
                const pages = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
                const assets = pages.every(Array.isArray) ? pages.flat() : pages;
                if (!Array.isArray(assets)) throw new Error("release assets response is malformed");
                const matches = assets.filter((asset) => asset?.name === name);
                if (matches.length > 1 || matches.some((asset) => !Number.isSafeInteger(asset.id) || asset.id <= 0)) throw new Error("release asset identity is ambiguous");
                if (matches.length === 1) process.stdout.write(String(matches[0].id));
              ' "${asset_name}")"
              if test -n "${existing_asset_id}"; then
                gh api --method DELETE --silent "repos/${GITHUB_REPOSITORY}/releases/assets/${existing_asset_id}"
              fi
              encoded_name="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "${asset_name}")"
              gh api --method POST \
                --silent \
                -H 'Accept: application/vnd.github+json' \
                -H 'Content-Type: application/octet-stream' \
                "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${encoded_name}" \
                --input "${asset}"
            done
          }

          release_edit_notes() {
            local response
            response="$(gh api --method PATCH \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -F "tag_name=${RELEASE_TAG}" \
              -F "target_commitish=${RELEASE_COMMIT}" \
              -F "body=@$1")"
            printf '%s' "${response}" | EXPECTED_RELEASE_DRAFT=true node scripts/github_release_identity.mjs >/dev/null
          }

          release_publish() {
            local response
            response="$(gh api --method PATCH \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -F "tag_name=${RELEASE_TAG}" \
              -F "target_commitish=${RELEASE_COMMIT}" \
              -F draft=false \
              -F "prerelease=${RELEASE_IS_PRERELEASE}")"
            printf '%s' "${response}" | EXPECTED_RELEASE_DRAFT=false REQUIRE_PUBLISHED_AT=true node scripts/github_release_identity.mjs >/dev/null
          }

          transaction_action() {
            OBSERVED_RELEASE_DRAFT="$1" OBSERVED_RELEASE_PRERELEASE="$2" \
              EXPECTED_RELEASE_PRERELEASE="${RELEASE_IS_PRERELEASE}" \
              node scripts/release_publish_transaction.mjs "$3"
          }

          restore_draft_or_fail() {
            local rollback_metadata rollback_draft rollback_prerelease
            if ! rollback_metadata="$(read_release_state)"; then
              echo "Rollback state for ${RELEASE_TAG} is ambiguous; manual inspection required. No rollback was attempted." >&2
              return 1
            fi
            IFS=$'\t' read -r rollback_draft rollback_prerelease <<< "${rollback_metadata}"
            if test "$(transaction_action "${rollback_draft}" "${rollback_prerelease}" rollback)" != "RESTORE_DRAFT"; then
              echo "Release ${RELEASE_TAG} changed before rollback; manual inspection required. No rollback was attempted." >&2
              return 1
            fi
            if ! (cd release && sha256sum --check SHA256SUMS); then
              echo "Validated DRAFT snapshot checksum verification failed; refusing rollback." >&2
              return 1
            fi
            if ! release_upload release/release-status.md release/release-manifest.json release/SHA256SUMS; then
              echo "DRAFT snapshot metadata restore failed; manual inspection required." >&2
              return 1
            fi
            if ! release_edit_notes release/release-status.md; then
              echo "DRAFT snapshot notes restore failed; manual inspection required." >&2
              return 1
            fi
            return 0
          }

          case "${PUBLICATION_ACTION}" in
            CREATE_DRAFT)
              create_args=("${RELEASE_TAG}" --verify-tag --target "${RELEASE_COMMIT}" --draft --title "Nian Pass ${RELEASE_TAG}" --notes-file release/release-status.md)
              if test "${RELEASE_IS_PRERELEASE}" = "true"; then
                create_args+=(--prerelease)
              fi
              gh release create "${create_args[@]}" release/*
              ;;
            UPDATE_DRAFT)
              if ! existing_metadata="$(read_release_state)"; then
                echo "Could not observe GitHub Release ${RELEASE_TAG}; refusing draft mutation." >&2
                exit 1
              fi
              IFS=$'\t' read -r existing_draft existing_prerelease <<< "${existing_metadata}"
              case "$(transaction_action "${existing_draft}" "${existing_prerelease}" pre-mutation)" in
                UPLOAD_CANDIDATE) ;;
                REFUSE_PUBLISHED)
                  echo "Release ${RELEASE_TAG} is already published; published release artifacts are immutable. Create a new version/tag instead." >&2
                  exit 1
                  ;;
                AMBIGUOUS)
                  echo "Release ${RELEASE_TAG} state or classification is ambiguous; refusing draft mutation." >&2
                  exit 1
                  ;;
                *) exit 1 ;;
              esac
              release_upload release/*
              release_edit_notes release/release-status.md
              ;;
            UPDATE_AND_PUBLISH)
              RELEASE_PUBLICATION_STATUS=DRAFT ARTIFACT_DIR="${GITHUB_WORKSPACE}/release" node scripts/release_artifacts.mjs validate-snapshot
              cp -a -- release release-publish-candidate
              FORGEJO_CI_STATUS="${FORGEJO_CI_STATUS}" ARTIFACT_DIR="${GITHUB_WORKSPACE}/release-publish-candidate" node scripts/release_artifacts.mjs publication-status PASS
              (cd release-publish-candidate && sha256sum --check SHA256SUMS)
              RELEASE_PUBLICATION_STATUS=PASS ARTIFACT_DIR="${GITHUB_WORKSPACE}/release-publish-candidate" node scripts/release_artifacts.mjs validate-snapshot
              mapfile -t publication_metadata < <(ARTIFACT_DIR="${GITHUB_WORKSPACE}/release" PUBLICATION_CANDIDATE_DIR="${GITHUB_WORKSPACE}/release-publish-candidate" node scripts/release_artifacts.mjs publication-candidate)
              test "${#publication_metadata[@]}" -eq 3
              candidate_metadata=()
              for name in "${publication_metadata[@]}"; do
                candidate_metadata+=("release-publish-candidate/${name}")
              done

              if ! existing_metadata="$(read_release_state)"; then
                echo "Could not observe GitHub Release ${RELEASE_TAG} before candidate upload; refusing mutation." >&2
                exit 1
              fi
              IFS=$'\t' read -r existing_draft existing_prerelease <<< "${existing_metadata}"
              case "$(transaction_action "${existing_draft}" "${existing_prerelease}" pre-mutation)" in
                UPLOAD_CANDIDATE) ;;
                REFUSE_PUBLISHED)
                  echo "Release ${RELEASE_TAG} is already published; published release artifacts are immutable. Create a new version/tag instead." >&2
                  exit 1
                  ;;
                AMBIGUOUS)
                  echo "Release ${RELEASE_TAG} state or classification is ambiguous; refusing candidate upload." >&2
                  exit 1
                  ;;
                *) exit 1 ;;
              esac

              set +e
              release_upload "${candidate_metadata[@]}"
              candidate_stage_exit=$?
              if test "${candidate_stage_exit}" -eq 0; then
                release_edit_notes release-publish-candidate/release-status.md
                candidate_stage_exit=$?
              fi
              set -e
              if test "${candidate_stage_exit}" -ne 0; then
                if restore_draft_or_fail; then
                  echo "PASS candidate staging failed; the validated DRAFT snapshot was restored." >&2
                fi
                exit 1
              fi
              set +e
              release_publish
              publish_exit=$?
              set -e

              if ! observed_metadata="$(read_release_state)"; then
                echo "Publication outcome for ${RELEASE_TAG} is ambiguous; manual inspection required. No rollback was attempted." >&2
                exit 1
              fi
              IFS=$'\t' read -r observed_draft observed_prerelease <<< "${observed_metadata}"
              case "$(transaction_action "${observed_draft}" "${observed_prerelease}" outcome)" in
                SUCCESS)
                  if test "${publish_exit}" -ne 0; then
                    echo "GitHub observed ${RELEASE_TAG} as published despite a client publish error." >&2
                  fi
                  ;;
                ROLLBACK_REQUIRED)
                  restore_draft_or_fail
                  echo "Publication of ${RELEASE_TAG} failed; the validated DRAFT snapshot was restored." >&2
                  exit 1
                  ;;
                AMBIGUOUS)
                  echo "Publication outcome for ${RELEASE_TAG} is ambiguous; manual inspection required. No rollback was attempted." >&2
                  exit 1
                  ;;
                *) exit 1 ;;
              esac
              ;;
            *)
              exit 1
              ;;
          esac
