services:
  sync-gateway:
    build:
      context: ..
      dockerfile: apps/sync-gateway/Dockerfile
    restart: unless-stopped
    environment:
      NIAN_PASS_GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
    secrets:
      - gateway_token
    volumes:
      - gateway-data:/data
    ports:
      - "127.0.0.1:8080:8080"

secrets:
  gateway_token:
    file: ./gateway-token.txt

volumes:
  gateway-data:
