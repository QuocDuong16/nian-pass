name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: docker
    timeout-minutes: 20
    container:
      image: rust:1.97.1-bookworm

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust quality components
        run: rustup component add rustfmt clippy

      - name: Verify KDBX fixture integrity
        run: sha256sum --check fixtures/kdbx/SHA256SUMS

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace

  keepassxc-compat:
    runs-on: docker
    timeout-minutes: 30
    container:
      image: rust:1.97.1-bookworm

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned KeePassXC CLI
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install \
            --yes \
            --no-install-recommends \
            keepassxc=2.7.4+dfsg.1-2
          keepassxc-cli --version
          dpkg-query --showformat='Package: ${Package}\nVersion: ${Version}\n' \
            --show keepassxc

      - name: Verify KDBX fixture integrity
        run: sha256sum --check fixtures/kdbx/SHA256SUMS

      - name: Run external KeePassXC compatibility suite
        run: scripts/test-keepassxc-compat.sh --require
