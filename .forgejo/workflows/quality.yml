name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: docker
    timeout-minutes: 35
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922

    steps:
      - name: Install Node.js runtime for actions
        run: |
          set -Eeuo pipefail
          node_version="26.7.0"
          case "$(uname -m)" in
            x86_64)
              node_arch="x64"
              node_checksum="982aa24dd8be4c889c6a8ab337ddff3b0896645b20f4239356e80552c16277ee"
              ;;
            aarch64)
              node_arch="arm64"
              node_checksum="afc7a004018485092ac8985b817b0d5684472bd9472e0b57d2ab88737e50090d"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          node_archive="node-v${node_version}-linux-${node_arch}.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${node_archive}" \
            "https://nodejs.org/dist/v${node_version}/${node_archive}"
          echo "${node_checksum}  /tmp/${node_archive}" | sha256sum --check -
          tar --extract --xz --file "/tmp/${node_archive}" \
            --directory /usr/local --strip-components=1

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust quality tooling
        run: make tools-install

      - name: Run canonical non-Tauri Rust gates
        run: make rust-core-check rust-deps-check rust-security-check

  desktop-frontend:
    runs-on: docker
    timeout-minutes: 25
    container:
      image: node:26.7.0-bookworm@sha256:e929171d35b9df7773a3ec5b068e387fa109441dc90f91e6560af5d39b7e9bf1

    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install and activate pinned pnpm
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.22.0
          corepack --version
          pnpm --version

      - name: Run repository policy gates
        run: make policy-check

      - name: Run canonical desktop and browser frontend gates
        run: |
          set -Eeuo pipefail
          base="${{ forgejo.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ forgejo.event.before }}"; fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then base="origin/main"; fi
          COVERAGE_DIFF_BASE="$base" make desktop-check
          COVERAGE_DIFF_BASE="$base" make browser-source-check browser-extension-check

  desktop-native-check:
    runs-on: docker
    timeout-minutes: 50
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922

    steps:
      - name: Install Node.js runtime for actions
        run: |
          set -Eeuo pipefail
          node_version="26.7.0"
          case "$(uname -m)" in
            x86_64)
              node_arch="x64"
              node_checksum="982aa24dd8be4c889c6a8ab337ddff3b0896645b20f4239356e80552c16277ee"
              ;;
            aarch64)
              node_arch="arm64"
              node_checksum="afc7a004018485092ac8985b817b0d5684472bd9472e0b57d2ab88737e50090d"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          node_archive="node-v${node_version}-linux-${node_arch}.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${node_archive}" \
            "https://nodejs.org/dist/v${node_version}/${node_archive}"
          echo "${node_checksum}  /tmp/${node_archive}" | sha256sum --check -
          tar --extract --xz --file "/tmp/${node_archive}" \
            --directory /usr/local --strip-components=1

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Tauri headless build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install \
            --yes \
            --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install and activate pinned pnpm
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.22.0
          corepack --version
          pnpm --version

      - name: Install pinned Rust quality tooling
        run: make tools-install

      - name: Run native and Rust coverage gates headlessly
        run: |
          set -Eeuo pipefail
          base="${{ forgejo.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ forgejo.event.before }}"; fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then base="origin/main"; fi
          make desktop-native-check browser-integration-check rust-coverage rust-coverage-check
          COVERAGE_DIFF_BASE="$base" make rust-coverage-diff

  windows-cross-check:
    runs-on: docker
    timeout-minutes: 20
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922

    steps:
      - name: Install Node.js runtime for actions
        run: |
          set -Eeuo pipefail
          node_version="26.7.0"
          case "$(uname -m)" in
            x86_64)
              node_arch="x64"
              node_checksum="982aa24dd8be4c889c6a8ab337ddff3b0896645b20f4239356e80552c16277ee"
              ;;
            aarch64)
              node_arch="arm64"
              node_checksum="afc7a004018485092ac8985b817b0d5684472bd9472e0b57d2ab88737e50090d"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          node_archive="node-v${node_version}-linux-${node_arch}.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${node_archive}" \
            "https://nodejs.org/dist/v${node_version}/${node_archive}"
          echo "${node_checksum}  /tmp/${node_archive}" | sha256sum --check -
          tar --extract --xz --file "/tmp/${node_archive}" \
            --directory /usr/local --strip-components=1

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Windows cross-compilation prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install \
            --yes \
            --no-install-recommends \
            gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu

      - name: Run canonical Windows core cross-check
        run: make windows-cross-check

  gateway-container:
    runs-on: docker
    timeout-minutes: 25

    steps:
      - name: Install pinned Node.js runtime
        run: |
          set -Eeuo pipefail
          node_version="26.7.0"
          case "$(uname -m)" in
            x86_64)
              node_arch="x64"
              node_checksum="982aa24dd8be4c889c6a8ab337ddff3b0896645b20f4239356e80552c16277ee"
              ;;
            aarch64)
              node_arch="arm64"
              node_checksum="afc7a004018485092ac8985b817b0d5684472bd9472e0b57d2ab88737e50090d"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          node_archive="node-v${node_version}-linux-${node_arch}.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${node_archive}" \
            "https://nodejs.org/dist/v${node_version}/${node_archive}"
          echo "${node_checksum}  /tmp/${node_archive}" | sha256sum --check -
          tar --extract --xz --file "/tmp/${node_archive}" \
            --directory /usr/local --strip-components=1

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned gateway policy dependencies
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.22.0
          corepack --version
          pnpm --version
          make scripts-install

      - name: Run documented non-root gateway container smoke
        run: make gateway-container-check

  keepassxc-compat:
    runs-on: docker
    timeout-minutes: 30
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922

    steps:
      - name: Install Node.js runtime for actions
        run: |
          set -Eeuo pipefail
          node_version="26.7.0"
          case "$(uname -m)" in
            x86_64)
              node_arch="x64"
              node_checksum="982aa24dd8be4c889c6a8ab337ddff3b0896645b20f4239356e80552c16277ee"
              ;;
            aarch64)
              node_arch="arm64"
              node_checksum="afc7a004018485092ac8985b817b0d5684472bd9472e0b57d2ab88737e50090d"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          node_archive="node-v${node_version}-linux-${node_arch}.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${node_archive}" \
            "https://nodejs.org/dist/v${node_version}/${node_archive}"
          echo "${node_checksum}  /tmp/${node_archive}" | sha256sum --check -
          tar --extract --xz --file "/tmp/${node_archive}" \
            --directory /usr/local --strip-components=1

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned KeePassXC CLI
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install \
            --yes \
            --no-install-recommends \
            keepassxc=2.7.4+dfsg.1-2
          keepassxc-cli --version
          dpkg-query --showformat='Package: ${Package}\nVersion: ${Version}\n' \
            --show keepassxc

      - name: Run required external compatibility gate
        run: make fixture-check compat-check-required
