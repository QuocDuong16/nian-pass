name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: docker
    timeout-minutes: 20
    container:
      image: rust:1.97.1-bookworm

    steps:
      - name: Install Node.js runtime for actions
        run: |
          set -Eeuo pipefail
          node_version="24.19.0"
          # Forgejo's Docker runners may use either supported 64-bit architecture.
          case "$(uname -m)" in
            x86_64)
              node_arch="x64"
              node_checksum="14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647"
              ;;
            aarch64)
              node_arch="arm64"
              node_checksum="01443c1e1a29e531ccad5a46fefa6df490d2189c49f7955904aecdbb0fe86fdc"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          node_archive="node-v${node_version}-linux-${node_arch}.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${node_archive}" \
            "https://nodejs.org/dist/v${node_version}/${node_archive}"
          echo "${node_checksum}  /tmp/${node_archive}" \
            | sha256sum --check -
          tar --extract --xz --file "/tmp/${node_archive}" \
            --directory /usr/local --strip-components=1
          node --version

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust quality components
        run: rustup component add rustfmt clippy

      - name: Verify KDBX fixture integrity
        run: sha256sum --check fixtures/kdbx/SHA256SUMS

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace

  windows-cross-check:
    runs-on: docker
    timeout-minutes: 20
    container:
      image: rust:1.97.1-bookworm

    steps:
      - name: Install Node.js runtime for actions
        run: |
          set -Eeuo pipefail
          node_version="24.19.0"
          case "$(uname -m)" in
            x86_64)
              node_arch="x64"
              node_checksum="14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647"
              ;;
            aarch64)
              node_arch="arm64"
              node_checksum="01443c1e1a29e531ccad5a46fefa6df490d2189c49f7955904aecdbb0fe86fdc"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          node_archive="node-v${node_version}-linux-${node_arch}.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${node_archive}" \
            "https://nodejs.org/dist/v${node_version}/${node_archive}"
          echo "${node_checksum}  /tmp/${node_archive}" \
            | sha256sum --check -
          tar --extract --xz --file "/tmp/${node_archive}" \
            --directory /usr/local --strip-components=1
          node --version

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Windows cross-compilation prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install \
            --yes \
            --no-install-recommends \
            gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu

      - name: Check vault-session for Windows
        run: cargo check --locked --all-targets --target x86_64-pc-windows-gnu -p vault-session

  keepassxc-compat:
    runs-on: docker
    timeout-minutes: 30
    container:
      image: rust:1.97.1-bookworm

    steps:
      - name: Install Node.js runtime for actions
        run: |
          set -Eeuo pipefail
          node_version="24.19.0"
          # Forgejo's Docker runners may use either supported 64-bit architecture.
          case "$(uname -m)" in
            x86_64)
              node_arch="x64"
              node_checksum="14b342e71204f811bde6153be8e04b62aef63c236fef92b55f9c83154b409647"
              ;;
            aarch64)
              node_arch="arm64"
              node_checksum="01443c1e1a29e531ccad5a46fefa6df490d2189c49f7955904aecdbb0fe86fdc"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          node_archive="node-v${node_version}-linux-${node_arch}.tar.xz"
          curl --fail --silent --show-error --location \
            --output "/tmp/${node_archive}" \
            "https://nodejs.org/dist/v${node_version}/${node_archive}"
          echo "${node_checksum}  /tmp/${node_archive}" \
            | sha256sum --check -
          tar --extract --xz --file "/tmp/${node_archive}" \
            --directory /usr/local --strip-components=1
          node --version

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned KeePassXC CLI
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install \
            --yes \
            --no-install-recommends \
            keepassxc=2.7.4+dfsg.1-2
          keepassxc-cli --version
          dpkg-query --showformat='Package: ${Package}\nVersion: ${Version}\n' \
            --show keepassxc

      - name: Verify KDBX fixture integrity
        run: sha256sum --check fixtures/kdbx/SHA256SUMS

      - name: Run external KeePassXC compatibility suite
        run: scripts/test-keepassxc-compat.sh --require
