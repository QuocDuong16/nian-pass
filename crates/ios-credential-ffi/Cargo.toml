[package]
name = "ios-credential-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Narrow C ABI for the Nian Pass iOS Password AutoFill extension"

[dependencies]
credential-provider-core.workspace = true
getrandom.workspace = true
kdbx = { path = "../kdbx" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
vault-core.workspace = true
zeroize.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
