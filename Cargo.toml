[workspace]
members = [
    "apps/cli",
    "crates/kdbx",
    "crates/vault-core",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
keepass = { version = "=0.13.21", default-features = false }
rpassword = "=7.5.4"
thiserror = "=2.0.20"
vault-core = { path = "crates/vault-core" }
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
