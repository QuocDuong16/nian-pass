[workspace]
members = [
    "apps/cli",
    "crates/kdbx",
    "crates/vault-core",
    "crates/vault-session",
    "crates/vault-sync",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
chrono = "=0.4.45"
keepass = { version = "=0.13.21", default-features = false, features = ["save_kdbx4"] }
getrandom = "=0.4.3"
rpassword = "=7.5.4"
sha2 = "=0.11.0"
thiserror = "=2.0.20"
uuid = "=1.24.1"
vault-core = { path = "crates/vault-core" }
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
