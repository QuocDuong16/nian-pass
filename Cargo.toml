[workspace]
members = [
    "apps/browser-native-host",
    "apps/cli",
    "apps/desktop/src-tauri",
    "crates/browser-native-protocol",
    "crates/credential-provider-core",
    "crates/ios-credential-ffi",
    "crates/kdbx",
    "crates/vault-core",
    "crates/vault-session",
    "crates/vault-sync",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
chrono = "=0.4.45"
keepass = { version = "=0.13.21", default-features = false, features = ["save_kdbx4"] }
getrandom = "=0.4.3"
rpassword = "=7.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.20"
url = "=2.5.8"
uuid = "=1.24.1"
vault-core = { path = "crates/vault-core" }
zeroize = "=1.9.0"
credential-provider-core = { path = "crates/credential-provider-core" }
browser-native-protocol = { path = "crates/browser-native-protocol" }
interprocess = "=2.4.3"
rustix = { version = "=1.1.4", default-features = false, features = ["process"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
