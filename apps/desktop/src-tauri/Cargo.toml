[package]
name = "nian-pass-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Tauri desktop shell for Nian Pass"

[lib]
name = "nian_pass_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "nian-pass-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde.workspace = true
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
vault-core.workspace = true
vault-session = { path = "../../../crates/vault-session" }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
