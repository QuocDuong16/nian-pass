[package]
name = "nian-pass-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Tauri desktop shell for Nian Pass"

[lib]
name = "nian_pass_desktop_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nian-pass-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
credential-provider-core.workspace = true
kdbx = { path = "../../../crates/kdbx" }
serde.workspace = true
sha2.workspace = true
tauri = { version = "=2.11.5", features = [] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
getrandom.workspace = true
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-dialog = "=2.7.2"
tokio = { version = "=1.53.1", features = ["time"] }
vault-core.workspace = true
vault-session = { path = "../../../crates/vault-session" }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
vault-core.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
tauri = { version = "=2.11.5", features = ["test"] }

[lints]
workspace = true
